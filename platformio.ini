; ESP32 Master/Slave Hotspot Mesh —      build configuration
[env:esp32dev]
platform = espressif32@6.9.0
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600

lib_deps =
    bblanchon/ArduinoJson@^6.21.5
    me-no-dev/ESPAsyncWebServer@^3.0.0
    me-no-dev/AsyncTCP@^3.0.0

build_flags =
    -DCORE_DEBUG_LEVEL=2
    ; ESP32-C3 native USB serial console. The USB port is the chip's native
    ; USB-Serial/JTAG (no UART bridge), so `Serial` must be bound to HWCDC.
    ; The core only exposes HWCDC `Serial` when BOTH macros are set; setting
    ; only CDC_ON_BOOT suppresses the UART `Serial` -> "'Serial' not declared".
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    ; TEMP DEBUG: force SETUP mode to capture verbose WiFi diagnostics. REMOVE.
    -D FORCE_SETUP_MODE=1

; Uncomment to enable async webserver regex support (not used by default).
;    -DASYNCWEBSERVER_REGEX=1

; ESP32 Master/Slave Hotspot Mesh — PlatformIO build configuration
[env:esp32dev]
platform = espressif32@6.9.0
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600

lib_deps =
    bblanchon/ArduinoJson@^6.21.5
    me-no-dev/ESPAsyncWebServer@^3.0.0
    me-no-dev/AsyncTCP@^3.0.0

build_flags =
    -DCORE_DEBUG_LEVEL=2

; Uncomment to enable async webserver regex support (not used by default).
;    -DASYNCWEBSERVER_REGEX=1

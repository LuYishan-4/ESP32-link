; ESP32 Master/Slave Hotspot Mesh — PlatformIO build configuration
[env:esp32dev]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

lib_deps =
    bblanchon/ArduinoJson@^6.21.5
    me-no-dev/ESPAsyncWebServer@^3.0.0
    me-no-dev/AsyncTCP@^3.0.0

build_flags =
    ; expose lib/ as a plain include folder so the documented include style works:
    ;   #include "datapacket/dp_common.h", #include "network/network_manager.h", ...
    -Ilib
    -DCORE_DEBUG_LEVEL=2

; Uncomment to enable async webserver regex support (not used by default).
;    -DASYNCWEBSERVER_REGEX=1
